<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convite Formal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            flex-direction: column;
            background-size: cover;
            background-image: url('./giphy.webp');
            background-position: center center;
            min-height: 100vh;
            padding: 20px 0;
            overflow-x: hidden;
        }

        img {
            width: 90vw;
            max-width: 400px;
            height: auto;
            margin-top: 80px;
        }

        h1 {
            color: rgb(0, 132, 26);
            font-size: 64px;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            letter-spacing: 0.5px;
            font-weight: 400;
            transform: translateY(-50px);
            text-shadow: 0 0 8px black;
            text-align: center;
            max-width: 90vw;
        }

        p {
            color: white;
            font-size: 32px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            transform: translateY(-55px);
            font-weight: 700;
            text-shadow: 0 0 6px black;
            text-align: center;
            max-width: 90vw;
            line-height: 1.2;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: -30px;
            flex-wrap: wrap;
            width: 90vw;
            max-width: 600px;
        }

        button {
            width: 80vw;
            max-width: 250px;
            background-color: black;
            color: white;
            height: 50px;
            font-weight: bold;
            font-size: 16px;
            background: linear-gradient(145deg, rgb(66, 211, 9), rgb(66, 211, 9));
            border: none;
            box-shadow: 0 0 20px rgb(12, 76, 196);
            transition: 0.3s;
            cursor: pointer;
        }

        #pos:hover {
            transform: scale(1.2);
            box-shadow: 0 0 60px rgb(1, 90, 255);
            transition: 0.5s;
        }

        #neg {
            background: linear-gradient(145deg, rgb(216, 11, 11), rgb(223, 223, 11));
            box-shadow: 0 0 20px rgb(3, 255, 45);
            transition: transform 0.3s ease;
            position: relative;
        }

        video {
            position: absolute;
            width: 100vw;
            height: auto;
            z-index: -1;
            opacity: 0.4;
        }

        /* Responsividade para telas pequenas */
        @media (max-width: 400px) {
            h1 {
                font-size: 40px !important;
            }

            p {
                font-size: 20px !important;
            }

            .botoes {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <img src="./bruns.webp" alt="" />
    <h1>Olá, Filipe</h1>
    <p>O senhor gostaria<br />de vir me visitar em Campinas no próximo fds disponível?</p>
    <div class="botoes">
        <a href="https://wa.me/553188210243?text=Claro%20que%20vou%20te%20visitar,%20sua%20linda" target="_blank" rel="noopener noreferrer">
            <button id="pos">SIM, FICARIA MUITO FELIZ</button>
        </a>
        <button id="neg">NÃO, VALEU VOU PRO DUNA</button>
    </div>

    <img src="./chuvas.webp" alt="" class="background" />
    <!--<video src="./Rain-Background.mp4" autoplay loop></video>-->

    <script>
        const botao = document.querySelector('#neg');

        function moverBotao() {
            let moveX = Math.random() * 801 - 400; // entre -400 e 400
            let moveY = Math.random() * 401 - 400; // entre -400 e 0
            botao.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }

        botao.addEventListener('mouseover', moverBotao);
        botao.addEventListener('touchstart', moverBotao);
    </script>
</body>
</html>
